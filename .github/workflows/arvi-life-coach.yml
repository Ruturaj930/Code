name: Arvi Life Coach - Daily Advice

on:
  schedule:
    # Run daily at 9:00 AM UTC (adjust timezone as needed)
    - cron: '0 9 * * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read
  issues: write  # Needed to create/update issues

jobs:
  run-life-coach:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Arvi Life Coach
        id: coach
        run: |
          python -c "
import sys
sys.path.insert(0, '.')
from app import get_advice
import json

# Sample questions for daily advice
questions = [
    'How can I improve my career as a developer?',
    'What skills should I learn next for career growth?',
    'How do I stay motivated during difficult projects?',
    'What are good habits for continuous learning?',
    'How can I build a better developer portfolio?'
  ]

import random
question = random.choice(questions)
advice = get_advice(question)

# Output for GitHub Actions
print(f'QUESTION={question}')
print(f'ADVICE={advice}')
print(f'question={question}' >> \$GITHUB_OUTPUT)
print(f'advice={advice}' >> \$GITHUB_OUTPUT)
"
        env:
          PYTHONPATH: .
              shell: bash

      - name: Create/Update Daily Advice Issue
        uses: actions/github-script@v7
        with:
          script: |
            const { question, advice } = ${{ toJson(steps.coach.outputs) }};
            const today = new Date().toISOString().split('T')[0];
            const title = `🧘 Arvi Daily Life Coach - ${today}`;
            const body = `## Today's Question
\`\`\`
${question}
\`\`\`

## Arvi's Advice
${advice}

---
*Generated by [Arvi Life Coach](https://github.com/Ruturaj930/Code) via GitHub Actions*`;

            // Check if issue for today already exists
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['arvi-daily-advice'],
              per_page: 10
            });

            const existingIssue = issues.find(issue => issue.title.includes(today));

            if (existingIssue) {
              // Update existing issue
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                title: title,
                body: body
              });
              console.log(`Updated existing issue #${existingIssue.number}`);
            } else {
              // Create new issue
              const { data: newIssue } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['arvi-daily-advice', 'life-coach', 'automated']
              });
              console.log(`Created new issue #${newIssue.number}: ${newIssue.html_url}`);
            }

      - name: Summary
        run: |
          echo "✅ Arvi Life Coach ran successfully!"
          echo "📅 Date: $(date -u +'%Y-%m-%d')"
          echo "❓ Question: ${{ steps.coach.outputs.question }}"
          echo "💡 Advice posted to GitHub Issues"